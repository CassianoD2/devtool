[package]
name = "devtool"
version = "1.5.0"
description = "Canivete suíço para desenvolvimento — app desktop offline"
authors = ["Cassiano Mesquita"]
license = "MIT"
repository = "https://github.com/cassianod2/devtool"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.6.0"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-fs = "2.5.2"

