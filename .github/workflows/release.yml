name: Release

on:
  push:
    branches: [main]
  # (re)compilar os bundles de uma tag já existente, sem cortar release novo
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente (ex.: v1.0.0)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # 1) só no push: semantic-release decide a versão, gera CHANGELOG + tag + Release.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) compila os bundles em cada plataforma e anexa ao Release:
  #    - no push, quando houve release novo
  #    - no workflow_dispatch, para a tag informada
  bundle:
    needs: version
    if: |
      always() &&
      (needs.version.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolver versão / tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${{ needs.version.outputs.version }}"
          fi
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"    >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libappindicator3-dev libxdo-dev patchelf
      - run: npm ci

      - name: Compilar bundles e publicar no Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseBody: "Notas em [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          releaseDraft: false
          args: ${{ matrix.args }}

      # ---- versões portáteis (rodam sem instalar nada) --------------------
      - name: Portable — Windows (.zip com o executável)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v   = "${{ steps.ver.outputs.version }}"
          $rel = "src-tauri/target/release"
          $out = "DevTool_${v}_windows-x64_portable.zip"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "$rel/devtool.exe" "portable/DevTool.exe"
          # inclui DLLs soltas (ex.: WebView2Loader.dll) se o build não linkar estático
          Get-ChildItem "$rel/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination portable
          Compress-Archive -Path "portable/*" -DestinationPath $out -Force
          gh release upload "${{ steps.ver.outputs.tag }}" $out --clobber

      - name: Portable — Linux (.tar.gz + AppImage sem libs conflitantes)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null   # gera ./squashfs-root (sem FUSE)
          mv squashfs-root "DevTool-${v}"

          # libepoxy / libwayland do Ubuntu 22.04 abortam com EGL_BAD_PARAMETER em
          # hosts com Mesa/compositor mais novos — remove pra usar as do sistema.
          rm -f "DevTool-${v}"/usr/lib/libepoxy.so.0* \
                "DevTool-${v}"/usr/lib/libwayland-client.so.0* \
                "DevTool-${v}"/usr/lib/libwayland-egl.so.1* \
                "DevTool-${v}"/usr/lib/libwayland-cursor.so.0* \
                "DevTool-${v}"/usr/lib/libwayland-server.so.0*

          # 1) portátil sem FUSE
          out="DevTool_${v}_linux-x64_portable.tar.gz"
          tar -czf "$out" "DevTool-${v}"
          gh release upload "$tag" "$out" --clobber

          # 2) reempacota o .AppImage a partir do AppDir corrigido (substitui o do tauri-action)
          wget -qO /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "DevTool-${v}" "$(basename "$appimage")"
          gh release upload "$tag" "$(basename "$appimage")" --clobber
