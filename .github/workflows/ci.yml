name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
  # recompila os bundles de uma tag já existente, sem cortar release novo
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente (ex.: v1.0.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancela runs de PR supersedidos; nunca cancela um release em andamento na main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---- checagens (todo push / PR) --------------------------------------------
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs

  web:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  rust:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar dependências de sistema (Tauri/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libappindicator3-dev libxdo-dev patchelf \
            build-essential curl wget file libssl-dev
      - uses: dtolnay/rust-toolchain@stable # usa branch por design; sem SHA fixo
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  versions:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node scripts/check-versions.mjs

  # ---- release (só push na main) -------------------------------------------
  # 1) semantic-release decide a versão, gera CHANGELOG + commit + tag.
  #    NÃO cria o GitHub Release — quem cria (como rascunho) é o tauri-action.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, rust, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) compila os bundles em cada plataforma; o tauri-action cria o Release como
  #    RASCUNHO (releaseDraft) e anexa os assets:
  #    - no push, quando houve release novo
  #    - no workflow_dispatch, para a tag informada
  bundle:
    needs: version
    if: |
      always() &&
      (needs.version.outputs.version != '' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serializado de propósito: 3 tauri-action concorrentes disputam o mesmo
      # Release rascunho e chegam a criar um 2º release pra mesma tag, espalhando
      # os assets (Win/macOS sumiam da v1.7.0). Um de cada vez elimina a corrida.
      max-parallel: 1
      matrix:
        include:
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolver versão / tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${{ needs.version.outputs.version }}"
          fi
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"    >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable # usa branch por design; sem SHA fixo
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libappindicator3-dev libxdo-dev patchelf
      - run: npm ci

      - name: Compilar bundles e anexar ao Release (rascunho)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # assina os artefatos do updater (.sig) — o latest.json final é montado no job publish
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # ---- versões portáteis (rodam sem instalar nada) --------------------
      - name: Portable — Windows (.zip com o executável)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v   = "${{ steps.ver.outputs.version }}"
          $rel = "src-tauri/target/release"
          $out = "DevTool_${v}_windows-x64_portable.zip"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "$rel/devtool.exe" "portable/DevTool.exe"
          # inclui DLLs soltas (ex.: WebView2Loader.dll) se o build não linkar estático
          Get-ChildItem "$rel/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination portable
          Compress-Archive -Path "portable/*" -DestinationPath $out -Force
          gh release upload "${{ steps.ver.outputs.tag }}" $out --clobber

      - name: Portable — Linux (.tar.gz + AppImage sem libs conflitantes)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null   # gera ./squashfs-root (sem FUSE)
          mv squashfs-root "DevTool-${v}"

          # libepoxy / libwayland do Ubuntu 22.04 abortam com EGL_BAD_PARAMETER em
          # hosts com Mesa/compositor mais novos — remove pra usar as do sistema.
          rm -f "DevTool-${v}"/usr/lib/libepoxy.so.0* \
                "DevTool-${v}"/usr/lib/libwayland-client.so.0* \
                "DevTool-${v}"/usr/lib/libwayland-egl.so.1* \
                "DevTool-${v}"/usr/lib/libwayland-cursor.so.0* \
                "DevTool-${v}"/usr/lib/libwayland-server.so.0*

          # 1) portátil sem FUSE
          out="DevTool_${v}_linux-x64_portable.tar.gz"
          tar -czf "$out" "DevTool-${v}"
          gh release upload "$tag" "$out" --clobber

          # 2) reempacota o .AppImage a partir do AppDir corrigido (substitui o do tauri-action)
          #    appimagetool pinado + conferido (nada de build "continuous")
          ait_ver=1.9.1
          ait_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          wget -qO /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${ait_ver}/appimagetool-x86_64.AppImage"
          echo "${ait_sha}  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "DevTool-${v}" "$(basename "$appimage")"
          gh release upload "$tag" "$(basename "$appimage")" --clobber

          # o .sig do tauri-action é do AppImage ORIGINAL; o reempacotado precisa
          # de assinatura nova senão o updater rejeita o download no Linux.
          npx --yes tauri signer sign "$(basename "$appimage")"
          gh release upload "$tag" "$(basename "$appimage").sig" --clobber

  # 3) só quando os 3 bundles terminaram: notas + SHA256SUMS + publica o rascunho
  publish:
    needs: [version, bundle]
    if: |
      always() &&
      needs.bundle.result == 'success' &&
      (needs.version.outputs.version != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notas, checksums e publicação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${{ needs.version.outputs.version }}"
          fi

          # 1 release por tag (o race do tauri-action já criou tags com 2)
          n_rel=$(gh api "repos/${GH_REPO}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$tag\")] | length")
          if [ "$n_rel" != "1" ]; then
            echo "::error::$n_rel releases para a tag $tag (esperado 1)"; exit 1
          fi

          # notas do release (só quando o semantic-release rodou; no dispatch fica vazio)
          if [ -n "${NOTES:-}" ]; then
            printf '%s\n' "$NOTES" > /tmp/notes.md
            gh release edit "$tag" --notes-file /tmp/notes.md
          fi

          tmp=$(mktemp -d); cd "$tmp"
          gh release download "$tag"

          # o updater (createUpdaterArtifacts + assinatura) entrou na v1.9.0 —
          # rebuild via workflow_dispatch de tag anterior não gera .sig/latest.json.
          ver="${tag#v}"
          need_updater=1
          if [ "$(printf '%s\n1.9.0\n' "$ver" | sort -V | head -1)" != "1.9.0" ]; then
            need_updater=0
          fi

          if [ "$need_updater" = 1 ]; then
            # latest.json do updater — montado aqui (não no tauri-action) pra não
            # depender da ordem/merge da matriz e pra pegar o .sig do AppImage
            # reempacotado. Chaves só das plataformas com artefato assinado.
            base="https://github.com/${GH_REPO}/releases/download/${tag}"
            appimage=$(ls *_amd64.AppImage 2>/dev/null | head -1 || true)
            nsis=$(ls *_x64-setup.exe 2>/dev/null | head -1 || true)
            macapp=$(ls *.app.tar.gz 2>/dev/null | head -1 || true)
            jq -n --arg v "$ver" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "${NOTES:-}" \
              '{version:$v, pub_date:$d, notes:$n, platforms:{}}' > latest.json
            add_platform() {  # $1=chave  $2=arquivo
              [ -n "$2" ] && [ -f "$2.sig" ] || return 0
              local j; j=$(mktemp)
              jq --arg k "$1" --arg url "$base/$2" --rawfile s "$2.sig" \
                '.platforms[$k]={signature:($s|rtrimstr("\n")), url:$url}' latest.json > "$j"
              mv "$j" latest.json
            }
            add_platform "linux-x86_64"   "$appimage"
            add_platform "windows-x86_64" "$nsis"
            add_platform "darwin-x86_64"  "$macapp"
            add_platform "darwin-aarch64" "$macapp"
            cat latest.json
            if [ "$(jq '.platforms | length' latest.json)" -lt 2 ]; then
              echo "::error::latest.json com menos de 2 plataformas — updater incompleto"; exit 1
            fi
            gh release upload "$tag" latest.json --clobber
          fi

          # SHA256SUMS.txt a partir dos assets já anexados (inclui latest.json + .sig)
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --clobber

          # confere que os 9 bundles das 3 plataformas chegaram (+ updater na v1.9.0+)
          pats="*.rpm *_amd64.deb *.AppImage *_linux-x64_portable.tar.gz *_universal.dmg *universal.app.tar.gz *_x64-setup.exe *_x64_en-US.msi *_windows-x64_portable.zip"
          if [ "$need_updater" = 1 ]; then
            pats="$pats latest.json *_amd64.AppImage.sig *_x64-setup.exe.sig"
          fi
          missing=""
          for pat in $pats; do
            ls $pat >/dev/null 2>&1 || missing="$missing $pat"
          done
          if [ -n "$missing" ]; then
            echo "::error::assets faltando na $tag:$missing — rascunho NÃO publicado"
            exit 1
          fi

          # promove o rascunho a release público (marca como "latest" — no
          # workflow_dispatch, só recompile a tag mais recente para não mexer nisso)
          gh release edit "$tag" --draft=false --latest
